name: Publish NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, Test, Pack and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "Release tag is required."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "Release tag must start with 'v' (example: v0.1.0)."
            exit 1
          fi

          echo "PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "Resolved package version: ${RELEASE_TAG#v}"

      - name: Restore
        run: dotnet restore OpResult.slnx

      - name: Build
        run: dotnet build OpResult.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project OpResult.Tests/OpResult.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack OpResult/OpResult.csproj --configuration Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./artifacts

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish package to GitHub Packages (NuGet)
        run: dotnet nuget push "./artifacts/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
