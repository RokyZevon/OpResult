name: Build and Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-24.04
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Resolve package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            echo "Prerelease publishing is not enabled for this workflow."
            exit 1
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable version in the form vX.Y.Z, for example v0.1.0."
            exit 1
          fi

          PACKAGE_VERSION="${RELEASE_TAG#v}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved package version: ${PACKAGE_VERSION}"

      - name: Restore
        run: dotnet restore OpResult.slnx

      - name: Build
        run: |
          dotnet build OpResult.slnx \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.PACKAGE_VERSION }} \
            -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
            -p:ContinuousIntegrationBuild=true

      - name: Test
        run: |
          dotnet test \
            --project OpResult.Tests/OpResult.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Pack
        run: |
          dotnet pack OpResult/OpResult.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./artifacts/packages \
            -p:Version=${{ env.PACKAGE_VERSION }} \
            -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push "./artifacts/packages/OpResult.${{ env.PACKAGE_VERSION }}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json"
